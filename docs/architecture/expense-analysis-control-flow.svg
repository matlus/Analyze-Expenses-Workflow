<g class="flow-node" data-key="step-01" tabindex="0" role="button" aria-label="01  Read expense file, Code"><rect class="card" x="465" y="240" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="255" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="271" class="title" font-size="19">01  Read expense file</text><rect x="1047" y="252" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="267" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="297" class="body" font-size="14">Load the ordered source lines.</text></g>
<g class="flow-node" data-key="step-02" tabindex="0" role="button" aria-label="02  Validate and parse lines, Code"><rect class="card" x="465" y="345" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="360" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="376" class="title" font-size="19">02  Validate and parse lines</text><rect x="1047" y="357" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="372" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="402" class="body" font-size="14">Extract dates, descriptions, and signed amounts.</text></g>
<g class="flow-node" data-key="step-03" tabindex="0" role="button" aria-label="03  Resolve ambiguous values, System 1 / Jev"><rect class="card" x="465" y="450" width="670" height="78" rx="16" fill="#fff6df" stroke="#aa7215" stroke-width="2"/><rect x="467" y="465" width="6" height="48" rx="3" fill="#aa7215"/><text x="487" y="481" class="title" font-size="19">03  Resolve ambiguous values</text><rect x="1001" y="462" width="116" height="22" rx="11" fill="#fff" stroke="#aa7215"/><text x="1059.0" y="477" text-anchor="middle" class="tag" fill="#aa7215">SYSTEM 1 · JEV</text><text x="487" y="507" class="body" font-size="14">Choose among dates or amounts found in the source text.</text></g>
<g class="flow-node" data-key="step-04" tabindex="0" role="button" aria-label="04  Complete uncertain fields, Large language model (LLM)"><rect class="card" x="465" y="555" width="670" height="78" rx="16" fill="#f3effc" stroke="#7351a5" stroke-width="2"/><rect x="467" y="570" width="6" height="48" rx="3" fill="#7351a5"/><text x="487" y="586" class="title" font-size="19">04  Complete uncertain fields</text><rect x="1047" y="567" width="70" height="22" rx="11" fill="#fff" stroke="#7351a5"/><text x="1082.0" y="582" text-anchor="middle" class="tag" fill="#7351a5">LLM</text><text x="487" y="612" class="body" font-size="14">Propose missing fields; code verifies source evidence.</text></g>
<g class="flow-node" data-key="step-05" tabindex="0" role="button" aria-label="05  Scatter line tasks, Code"><rect class="card" x="465" y="660" width="670" height="78" rx="16" fill="#edf7ee" stroke="#397356" stroke-width="2"/><rect x="467" y="675" width="6" height="48" rx="3" fill="#397356"/><text x="487" y="691" class="title" font-size="19">05  Scatter line tasks</text><rect x="1047" y="672" width="70" height="22" rx="11" fill="#fff" stroke="#397356"/><text x="1082.0" y="687" text-anchor="middle" class="tag" fill="#397356">CODE</text><text x="487" y="717" class="body" font-size="14">Start one task per line; incomplete lines return no category.</text></g>
<g class="flow-node" data-key="step-06" tabindex="0" role="button" aria-label="06  Gather line results, Code"><rect class="card" x="465" y="1150" width="670" height="78" rx="16" fill="#edf7ee" stroke="#397356" stroke-width="2"/><rect x="467" y="1165" width="6" height="48" rx="3" fill="#397356"/><text x="487" y="1181" class="title" font-size="19">06  Gather line results</text><rect x="1047" y="1162" width="70" height="22" rx="11" fill="#fff" stroke="#397356"/><text x="1082.0" y="1177" text-anchor="middle" class="tag" fill="#397356">CODE</text><text x="487" y="1207" class="body" font-size="14">Converge all tasks and restore source-line order.</text></g>
<g class="flow-node" data-key="step-07" tabindex="0" role="button" aria-label="07  Reconcile the ledger, Code"><rect class="card" x="465" y="1255" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="1270" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="1286" class="title" font-size="19">07  Reconcile the ledger</text><rect x="1047" y="1267" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="1282" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="1312" class="body" font-size="14">Apply confirmed duplicates and transaction treatments.</text></g>
<g class="flow-node" data-key="step-08" tabindex="0" role="button" aria-label="08  Calculate totals and comparisons, Code"><rect class="card" x="465" y="1360" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="1375" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="1391" class="title" font-size="19">08  Calculate totals and comparisons</text><rect x="1047" y="1372" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="1387" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="1417" class="body" font-size="14">Sum monthly amounts, budgets, and changes with decimal arithmetic.</text></g>
<g class="flow-node" data-key="step-09" tabindex="0" role="button" aria-label="09  Check the totals balance, Code"><rect class="card" x="465" y="1465" width="670" height="78" rx="16" fill="#fff0ef" stroke="#b85454" stroke-width="2"/><rect x="467" y="1480" width="6" height="48" rx="3" fill="#b85454"/><text x="487" y="1496" class="title" font-size="19">09  Check the totals balance</text><rect x="1047" y="1477" width="70" height="22" rx="11" fill="#fff" stroke="#b85454"/><text x="1082.0" y="1492" text-anchor="middle" class="tag" fill="#b85454">CODE</text><text x="487" y="1522" class="body" font-size="14">Require the source lines and monetary totals to reconcile.</text></g>
<g class="flow-node" data-key="step-10" tabindex="0" role="button" aria-label="10  Select three findings, Large language model (LLM)"><rect class="card" x="465" y="1570" width="670" height="78" rx="16" fill="#f3effc" stroke="#7351a5" stroke-width="2"/><rect x="467" y="1585" width="6" height="48" rx="3" fill="#7351a5"/><text x="487" y="1601" class="title" font-size="19">10  Select three findings</text><rect x="1047" y="1582" width="70" height="22" rx="11" fill="#fff" stroke="#7351a5"/><text x="1082.0" y="1597" text-anchor="middle" class="tag" fill="#7351a5">LLM</text><text x="487" y="1627" class="body" font-size="14">Choose evidence IDs; code supplies the final wording.</text></g>
<g class="flow-node" data-key="step-11" tabindex="0" role="button" aria-label="11  Assemble the analysis, Code"><rect class="card" x="465" y="1675" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="1690" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="1706" class="title" font-size="19">11  Assemble the analysis</text><rect x="1047" y="1687" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="1702" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="1732" class="body" font-size="14">Collect the ledger, calculations, findings, and method.</text></g>
<g class="flow-node" data-key="step-12" tabindex="0" role="button" aria-label="12  Render the report, Code"><rect class="card" x="465" y="1780" width="670" height="78" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="467" y="1795" width="6" height="48" rx="3" fill="#197487"/><text x="487" y="1811" class="title" font-size="19">12  Render the report</text><rect x="1047" y="1792" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1082.0" y="1807" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="487" y="1837" class="body" font-size="14">Compose the Markdown tables, method, and findings.</text></g>
<g class="flow-node" data-key="step-13" tabindex="0" role="button" aria-label="13  Deliver the report, Code"><rect class="card" x="465" y="1885" width="670" height="78" rx="16" fill="#eef4fc" stroke="#426c9a" stroke-width="2"/><rect x="467" y="1900" width="6" height="48" rx="3" fill="#426c9a"/><text x="487" y="1916" class="title" font-size="19">13  Deliver the report</text><rect x="1047" y="1897" width="70" height="22" rx="11" fill="#fff" stroke="#426c9a"/><text x="1082.0" y="1912" text-anchor="middle" class="tag" fill="#426c9a">CODE</text><text x="487" y="1942" class="body" font-size="14">Print to console; optionally write a Markdown file.</text></g>
<g class="flow-node" data-key="choose-category-1" tabindex="0" role="button" aria-label="Choose category · line A, System 1 / Jev"><rect class="card" x="80" y="860" width="380" height="70" rx="16" fill="#fff6df" stroke="#aa7215" stroke-width="2"/><rect x="82" y="875" width="6" height="40" rx="3" fill="#aa7215"/><text x="102" y="891" class="title" font-size="16">Choose category · line A</text><rect x="326" y="872" width="116" height="22" rx="11" fill="#fff" stroke="#aa7215"/><text x="384.0" y="887" text-anchor="middle" class="tag" fill="#aa7215">SYSTEM 1 · JEV</text><text x="102" y="917" class="body" font-size="13">Jev uses the fixed category choices.</text></g>
<g class="flow-node" data-key="choose-category-2" tabindex="0" role="button" aria-label="Choose category · line B, System 1 / Jev"><rect class="card" x="610" y="860" width="380" height="70" rx="16" fill="#fff6df" stroke="#aa7215" stroke-width="2"/><rect x="612" y="875" width="6" height="40" rx="3" fill="#aa7215"/><text x="632" y="891" class="title" font-size="16">Choose category · line B</text><rect x="856" y="872" width="116" height="22" rx="11" fill="#fff" stroke="#aa7215"/><text x="914.0" y="887" text-anchor="middle" class="tag" fill="#aa7215">SYSTEM 1 · JEV</text><text x="632" y="917" class="body" font-size="13">An independent per-line decision.</text></g>
<g class="flow-node" data-key="choose-category-3" tabindex="0" role="button" aria-label="Choose category · line …, System 1 / Jev"><rect class="card" x="1140" y="860" width="380" height="70" rx="16" fill="#fff6df" stroke="#aa7215" stroke-width="2"/><rect x="1142" y="875" width="6" height="40" rx="3" fill="#aa7215"/><text x="1162" y="891" class="title" font-size="16">Choose category · line …</text><rect x="1386" y="872" width="116" height="22" rx="11" fill="#fff" stroke="#aa7215"/><text x="1444.0" y="887" text-anchor="middle" class="tag" fill="#aa7215">SYSTEM 1 · JEV</text><text x="1162" y="917" class="body" font-size="13">More lines share the eight-call limit.</text></g>
<g class="flow-node" data-key="apply-category-rules-1" tabindex="0" role="button" aria-label="Apply category rules · A, Code"><rect class="card" x="80" y="965" width="380" height="70" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="82" y="980" width="6" height="40" rx="3" fill="#197487"/><text x="102" y="996" class="title" font-size="16">Apply category rules · A</text><rect x="372" y="977" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="407.0" y="992" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="102" y="1022" class="body" font-size="13">Code enforces merchant and cash rules.</text></g>
<g class="flow-node" data-key="apply-category-rules-2" tabindex="0" role="button" aria-label="Apply category rules · B, Code"><rect class="card" x="610" y="965" width="380" height="70" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="612" y="980" width="6" height="40" rx="3" fill="#197487"/><text x="632" y="996" class="title" font-size="16">Apply category rules · B</text><rect x="902" y="977" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="937.0" y="992" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="632" y="1022" class="body" font-size="13">Code may override Jev&#x27;s proposal.</text></g>
<g class="flow-node" data-key="apply-category-rules-3" tabindex="0" role="button" aria-label="Apply category rules · …, Code"><rect class="card" x="1140" y="965" width="380" height="70" rx="16" fill="#ecf7f8" stroke="#197487" stroke-width="2"/><rect x="1142" y="980" width="6" height="40" rx="3" fill="#197487"/><text x="1162" y="996" class="title" font-size="16">Apply category rules · …</text><rect x="1432" y="977" width="70" height="22" rx="11" fill="#fff" stroke="#197487"/><text x="1467.0" y="992" text-anchor="middle" class="tag" fill="#197487">CODE</text><text x="1162" y="1022" class="body" font-size="13">Each task returns a category or no result.</text></g>
<text x="76" y="1994" class="minor" font-size="13">Recovery stages pass through when unneeded. Scatter starts one task per line; up to eight Jev calls run at once. Every task contributes to the gather.</text>
</svg>

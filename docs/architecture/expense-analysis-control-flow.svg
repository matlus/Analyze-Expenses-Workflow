<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="2020" viewBox="0 0 1600 2020" role="group" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Expense analysis control flow</title>
<desc id="diagram-desc">A top-down flow from file input through coded parsing, Jev and LLM decisions, parallel line categorization, reconciliation, calculations, findings, and report output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#677b8a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3550" flood-opacity=".10"/></filter></defs>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.title{font-weight:700;fill:#172d3d}.body{fill:#435c6d}.minor{fill:#607486}.edge{fill:none;stroke:#677b8a;stroke-width:2.8;marker-end:url(#arrow)}.flow-node{filter:url(#shadow);cursor:pointer}.flow-node>.card{transition:stroke-width .15s,filter .15s}.flow-node:hover>.card,.flow-node:focus>.card,.flow-node.is-active>.card{stroke-width:4;filter:brightness(.94)}.flow-node:focus{outline:none}.tag{font-size:11px;font-weight:700;letter-spacing:.7px}</style>
<rect width="1600" height="2020" fill="#f7fafc"/>
<rect x="44" y="30" width="1512" height="103" rx="21" fill="#ffffff" stroke="#dce7ed"/>
<text x="76" y="75" class="title" font-size="29">Expense analysis · control flow</text>
<text x="77" y="107" class="minor" font-size="15">Document-defined steps · hover or focus a box for details</text>
<rect x="44" y="148" width="1512" height="64" rx="15" fill="#ffffff" stroke="#dce7ed"/>
<rect x="75" y="169" width="19" height="19" rx="5" fill="#ecf7f8" stroke="#197487" stroke-width="2"/>
<text x="104" y="185" class="body" font-size="13" font-weight="700">CODE</text>
<rect x="331" y="169" width="19" height="19" rx="5" fill="#fff6df" stroke="#aa7215" stroke-width="2"/>
<text x="360" y="185" class="body" font-size="13" font-weight="700">SYSTEM 1 / JEV</text>
<rect x="637" y="169" width="19" height="19" rx="5" fill="#f3effc" stroke="#7351a5" stroke-width="2"/>
<text x="666" y="185" class="body" font-size="13" font-weight="700">LLM</text>
<rect x="803" y="169" width="19" height="19" rx="5" fill="#fff0ef" stroke="#b85454" stroke-width="2"/>
<text x="832" y="185" class="body" font-size="13" font-weight="700">CHECK</text>
<rect x="977" y="169" width="19" height="19" rx="5" fill="#edf7ee" stroke="#397356" stroke-width="2"/>
<text x="1006" y="185" class="body" font-size="13" font-weight="700">SCATTER / GATHER</text>
<rect x="1332" y="169" width="19" height="19" rx="5" fill="#eef4fc" stroke="#426c9a" stroke-width="2"/>
<text x="1361" y="185" class="body" font-size="13" font-weight="700">OUTPUT</text>

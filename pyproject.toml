# ============================================================================
# WORKSPACE ROOT - uv workspace + shared tool configuration
# ============================================================================
# This root is a uv project so workspace commands have an explicit anchor, but
# it is not built or installed as a Python package.

[project]
name = "analyze-expenses-workflow-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["packages/_tmp", "apps/_tmp"]

# ============================================================================
# RUFF - LINTING AND FORMATTING (shared across all packages)
# ============================================================================
[tool.ruff]
line-length = 150
target-version = "py314"
extend-exclude = ["build", "dist", ".uv-cache", ".workspace_tmp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
]

ignore = [
    "COM812",
    "ISC001",
    "TD002",
    "TD003",
    "FIX002",
    "PERF203",
    "S311",
    "TRY003",
    "EM101",
    "EM102",
    "G004",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TRY300",
    "TRY400",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"**/exceptions/*.py" = ["N818"]
"**/tests/**/*.py" = [
    "S101",
    "ARG",
    "INP001",
    "PLR0913",
    "PLR2004",
    "ANN",
    "N802",
    "N803",
    "N806",
    "SLF001",
    "FBT",
    "PT004",
    "PT023",
]
"**/entry_point.py" = ["I001"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["analyze_expenses_workflow", "analyze_expenses_workflow_app"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

# ============================================================================
# PYRIGHT - STRICT TYPE CHECKING (shared across all packages)
# ============================================================================
[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "apps/*/src"]
extraPaths = [
    "packages/analyze-expenses-workflow/src",
    "apps/analyze-expenses-workflow-app/src",
]
exclude = ["**/tests", "**/__pycache__", "**/old/**", "build", "dist"]
reportMissingImports = "error"
reportUnusedImport = "error"
reportUnknownParameterType = "error"
reportPrivateUsage = "error"
reportPrivateImportUsage = "error"
reportTypeCommentUsage = "error"
reportInvalidTypeVarUse = "error"
reportConstantRedefinition = "error"
reportDuplicateImport = "error"
reportInconsistentConstructor = "error"
reportUninitializedInstanceVariable = "none"
reportCallInDefaultInitializer = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMatchNotExhaustive = "error"
reportImplicitOverride = "error"
reportMissingModuleSource = "warning"
reportMissingTypeStubs = "warning"
reportUnusedVariable = "warning"
reportUnknownVariableType = "warning"
reportUntypedFunctionDecorator = "warning"
reportUnknownMemberType = "warning"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportUntypedBaseClass = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedNamedTuple = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedExpression = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportImplicitStringConcatenation = "warning"
reportPropertyTypeMismatch = "warning"
reportMissingSuperCall = "none"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "warning"
reportInvalidStubStatement = "warning"
reportIncompleteStub = "warning"
reportInvalidTypeForm = "warning"

# ============================================================================
# PYTEST - ROOT TEST DISCOVERY (shared across all packages and apps)
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = ["live_jev: calls the real Jev service through OpenRouter"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
norecursedirs = [
    ".git",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    ".pyright",
    "build",
    "dist",
    "__pycache__",
]
pythonpath = [
    "packages/analyze-expenses-workflow/src",
    "apps/analyze-expenses-workflow-app/src",
]

# ============================================================================
# COVERAGE - SHARED DEFAULTS
# ============================================================================
[tool.coverage.run]
source = ["packages", "apps"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
